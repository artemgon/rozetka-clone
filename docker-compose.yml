version: '3.8'

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: rozetka_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: rozetka_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: rozetka_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@rozetka.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres_db

volumes:
  pgdata: